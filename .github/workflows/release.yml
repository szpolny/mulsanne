name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Nix flake users follow `github:szpolny/mulsanne/release`, a tag that always
  # points at the latest release commit, so `nix flake update` never picks up
  # unreleased changes from master.
  release-tag:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Move the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/release" \
            -f sha="$SHA" -F force=true 2>/dev/null \
            || gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref=refs/tags/release -f sha="$SHA"

  # The online API ships from the mulsanne-server repo, before the app that
  # needs it. This only checks that production is new enough for this app
  # (src-tauri/min-server-version.txt) before the installer is built; installed
  # apps aren't offered the update until that build publishes it.
  check-api:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the production API version
        shell: bash
        run: |
          required=$(tr -d '[:space:]' < src-tauri/min-server-version.txt)
          # Empty if production is unreachable or too old to report a version.
          live=$( (curl -fsS --retry 3 --max-time 20 https://api.mulsanne.xyz/v1/version || true) | tr -d '[:space:]')
          echo "Needs mulsanne-server $required; production runs ${live:-nothing}"
          if [[ ! "$live" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || [[ "$(printf '%s\n%s\n' "$required" "$live" | sort -V | head -n1)" != "$required" ]]; then
            echo "::error::Release mulsanne-server $required (or newer) to production first, then re-run this job."
            exit 1
          fi

  build:
    needs: [release-please, check-api]
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: Mulsanne ${{ needs.release-please.outputs.tag_name }}
          includeUpdaterJson: true

  # The Linux packages only need the Wine bridge, so building it on its own lets
  # the Linux job start without waiting for the whole Windows installer.
  bridge:
    needs: [release-please, check-api]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --manifest-path lmu-bridge/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: lmu-bridge
          path: lmu-bridge/target/release/lmu-bridge.exe

  linux:
    needs: [release-please, bridge]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lmu-bridge
          path: src-tauri/resources
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-layer-shell-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-sign --bundles deb,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: Mulsanne ${{ needs.release-please.outputs.tag_name }}
          includeUpdaterJson: false

  linux-packages:
    needs: [release-please, linux]
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/linux-packages.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
