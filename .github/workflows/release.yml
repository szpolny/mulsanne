name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The online API ships from the mulsanne-server repo, before the app that
  # needs it. This only checks that production is new enough for this app
  # (src-tauri/min-server-version.txt) before the installer is built; installed
  # apps aren't offered the update until that build publishes it.
  check-api:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the production API version
        shell: bash
        run: |
          required=$(tr -d '[:space:]' < src-tauri/min-server-version.txt)
          # Empty if production is unreachable or too old to report a version.
          live=$( (curl -fsS --retry 3 --max-time 20 https://api.mulsanne.xyz/v1/version || true) | tr -d '[:space:]')
          echo "Needs mulsanne-server $required; production runs ${live:-nothing}"
          if [[ ! "$live" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || [[ "$(printf '%s\n%s\n' "$required" "$live" | sort -V | head -n1)" != "$required" ]]; then
            echo "::error::Release mulsanne-server $required (or newer) to production first, then re-run this job."
            exit 1
          fi

  build:
    needs: [release-please, check-api]
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: Mulsanne ${{ needs.release-please.outputs.tag_name }}
          includeUpdaterJson: true

      - name: Build the Wine bridge
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --locked --release --manifest-path lmu-bridge/Cargo.toml
          gh release upload "${{ needs.release-please.outputs.tag_name }}" lmu-bridge/target/release/lmu-bridge.exe scripts/run-lmu-bridge.sh --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-experimental:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble experimental Linux installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --pattern '*.AppImage' --pattern 'lmu-bridge.exe'
          images=(release-assets/*.AppImage)
          archive="Mulsanne_${RELEASE_TAG#v}_linux-experimental_x86_64.tar.gz"
          bash scripts/package-linux.sh "${images[0]}" release-assets/lmu-bridge.exe "$archive"
          sha256sum "$archive" > "$archive.sha256"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber
