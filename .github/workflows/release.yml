name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Ships the online API with the app: deploys the server's master (what the
  # testing environment runs) to production before the installer is built, so
  # no installed app updates ahead of the API it needs. The server must stay
  # compatible with older app versions, which keep running after a release.
  deploy-api:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    env:
      SERVER_REPO: szpolny/mulsanne-server
      # Fine-grained token with read access to the server repo's contents and actions.
      GH_TOKEN: ${{ secrets.SERVER_REPO_TOKEN }}
    steps:
      - name: Find the server commit and wait for its CI
        id: server
        shell: bash
        run: |
          sha=$(gh api "repos/$SERVER_REPO/commits/master" --jq .sha)
          echo "Server master is $sha"
          # Its CI run tests it and deploys it to testing; production gets the same commit.
          for _ in $(seq 60); do
            run=$(gh api "repos/$SERVER_REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push" \
              --jq '(.workflow_runs[0] // {}) | "\(.status // "none") \(.conclusion // "")"')
            case "$run" in
              "completed success") echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0 ;;
              completed*) echo "::error::Server CI for $sha finished with: $run"; exit 1 ;;
              *) echo "Server CI: $run; waiting"; sleep 30 ;;
            esac
          done
          echo "::error::Timed out waiting for server CI on $sha"
          exit 1

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SERVER_REPO }}
          ref: ${{ steps.server.outputs.sha }}
          token: ${{ secrets.SERVER_REPO_TOKEN }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy -c fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

  build:
    needs: [release-please, deploy-api]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: Mulsanne ${{ needs.release-please.outputs.tag_name }}
          includeUpdaterJson: true
