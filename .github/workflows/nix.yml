name: Nix

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - package.json
      - pnpm-lock.yaml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - packaging/linux/**
      - scripts/run-lmu-bridge.sh
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    # Release PRs only bump version numbers, which can't break the Nix build.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs .#mulsanne
