name: Feature request
description: Suggest an improvement or new feature for Mulsanne.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before suggesting a feature.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case and what is difficult or missing today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternatives or workarounds you have tried.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, sketches, or examples that help explain the idea.
