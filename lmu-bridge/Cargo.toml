[package]
name = "lmu-bridge"
version = "0.1.0"
description = "Mirrors LMU's shared memory into a file so native Linux Mulsanne can read it"
license = "MIT"
edition = "2021"

# Windows-only: run it with Wine/Proton inside the Le Mans Ultimate prefix.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
